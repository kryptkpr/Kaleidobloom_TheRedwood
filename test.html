<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Test</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    #log {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 999; background: rgba(0,0,0,0.8);
      padding: 10px; font-size: 13px; line-height: 1.8;
      pointer-events: none;
    }
    #start-btn {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 16px 40px;
      font-size: 18px;
      background: #fff; color: #000;
      border: none; border-radius: 4px;
      cursor: pointer;
    }
    a-scene { position: fixed !important; inset: 0; }
  </style>
</head>
<body>

  <div id="log">⏳ Waiting for Begin tap...</div>
  <button id="start-btn">Begin AR</button>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none;">

    <a-assets>
      <video id="redwood-video" src="video/Redwood_ARfractal.mp4"
        playsinline webkit-playsinline loop crossorigin="anonymous" preload="auto">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#redwood-video" position="0 0 0.001" width="1" height="0.753"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('start-btn');
    const arScene = document.getElementById('ar-scene');
    const video = document.getElementById('redwood-video');

    function addLog(msg) {
      log.innerHTML += '<br>' + msg;
      console.log(msg);
    }

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      arScene.style.display = 'block';
      addLog('✅ Begin tapped — scene visible');

      arScene.addEventListener('loaded', () => {
        addLog('✅ A-Frame loaded');
        const sys = arScene.systems['mindar-image-system'];
        if (sys) {
          addLog('✅ MindAR system found — calling start()');
          sys.start();
        } else {
          addLog('❌ MindAR system NOT found');
        }
      });

      arScene.addEventListener('arReady', () => {
        addLog('✅ arReady — camera is live!');
      });

      arScene.addEventListener('arError', (e) => {
        addLog('❌ arError: ' + JSON.stringify(e.detail));
      });

      const target = arScene.querySelector('[mindar-image-target]');
      target.addEventListener('targetFound', () => {
        addLog('🎯 Target found — playing video');
        video.play().catch(e => addLog('❌ Video play error: ' + e.message));
      });
      target.addEventListener('targetLost', () => {
        addLog('👁 Target lost');
        video.pause();
      });
    });
  </script>

</body>
</html>
