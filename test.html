<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Test</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js" onload="document.getElementById('log').innerHTML+='<br>✅ A-Frame script loaded'" onerror="document.getElementById('log').innerHTML+='<br>❌ A-Frame script FAILED'"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js" onload="document.getElementById('log').innerHTML+='<br>✅ MindAR script loaded'" onerror="document.getElementById('log').innerHTML+='<br>❌ MindAR script FAILED'"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }

    #log {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 999; background: rgba(0,0,0,0.85);
      padding: 12px; font-size: 13px; line-height: 2;
      max-height: 50vh; overflow-y: auto;
      pointer-events: none;
    }

    /* Overlay sits ON TOP of the scene — scene always in DOM and visible */
    #start-overlay {
      position: fixed; inset: 0;
      z-index: 99;
      background: #000;
      display: flex; align-items: center; justify-content: center;
    }

    #start-overlay.hidden { display: none; }

    #start-btn {
      padding: 16px 40px;
      font-size: 18px;
      background: #fff; color: #000;
      border: none; border-radius: 4px;
      cursor: pointer;
    }

    /* Scene is always in the DOM — never display:none */
    a-scene { position: fixed !important; inset: 0; }
  </style>
</head>
<body>

  <div id="log">⏳ Page loaded — scripts loading...</div>

  <!-- Black overlay hides the scene until user taps Begin -->
  <div id="start-overlay">
    <button id="start-btn">Begin AR</button>
  </div>

  <!-- Scene is always present and visible in DOM -->
  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="redwood-video" src="video/Redwood_ARfractal.mp4"
        playsinline webkit-playsinline loop crossorigin="anonymous" preload="auto">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#redwood-video" position="0 0 0.001" width="1" height="0.753"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('start-btn');
    const overlay = document.getElementById('start-overlay');
    const arScene = document.getElementById('ar-scene');
    const video = document.getElementById('redwood-video');

    function addLog(msg) {
      log.innerHTML += '<br>' + msg;
      console.log(msg);
    }

    window.addEventListener('error', (e) => {
      addLog('❌ JS Error: ' + e.message);
    });

    window.addEventListener('unhandledrejection', (e) => {
      addLog('❌ Promise rejection: ' + e.reason);
    });

    // Log when A-Frame fires loaded — even before user taps
    arScene.addEventListener('loaded', () => {
      addLog('✅ A-Frame loaded');
      const sys = arScene.systems && arScene.systems['mindar-image-system'];
      addLog(sys ? '✅ MindAR system present on load' : '⚠️ MindAR system not yet on load (normal)');
    });

    btn.addEventListener('click', () => {
      overlay.classList.add('hidden');
      addLog('✅ Begin tapped — starting MindAR');

      let attempts = 0;
      const poll = setInterval(() => {
        attempts++;
        const sys = arScene.systems && arScene.systems['mindar-image-system'];
        if (sys) {
          clearInterval(poll);
          addLog('✅ MindAR system found after ' + attempts + ' attempt(s)');
          try {
            sys.start();
            addLog('✅ start() called');
          } catch(e) {
            addLog('❌ start() error: ' + e.message);
          }
        } else if (attempts >= 50) {
          clearInterval(poll);
          addLog('❌ MindAR system never appeared after ' + attempts + ' attempts');
        }
      }, 200);

      arScene.addEventListener('arReady', () => {
        addLog('✅ arReady — camera is live!');
      });

      arScene.addEventListener('arError', (e) => {
        addLog('❌ arError: ' + JSON.stringify(e.detail));
      });

      const target = arScene.querySelector('[mindar-image-target]');
      target.addEventListener('targetFound', () => {
        addLog('🎯 Target found — playing video');
        video.play().catch(e => addLog('❌ Video error: ' + e.message));
      });
      target.addEventListener('targetLost', () => {
        addLog('👁 Target lost');
        video.pause();
      });
    });
  </script>

</body>
</html>
