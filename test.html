<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AR Test</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; }
    #log {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 999; background: rgba(0,0,0,0.85);
      padding: 12px; font-size: 13px; line-height: 2;
      max-height: 50vh; overflow-y: auto;
      pointer-events: none;
    }
    #start-btn {
      position: fixed; bottom: 40px; left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      padding: 16px 40px;
      font-size: 18px;
      background: #fff; color: #000;
      border: none; border-radius: 4px;
      cursor: pointer;
    }
    a-scene { position: fixed !important; inset: 0; }
  </style>
</head>
<body>

  <div id="log">⏳ Waiting for Begin tap...</div>
  <button id="start-btn">Begin AR</button>

  <a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: targets/targets.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    style="display:none;">

    <a-assets>
      <video id="redwood-video" src="video/Redwood_ARfractal.mp4"
        playsinline webkit-playsinline loop crossorigin="anonymous" preload="auto">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#redwood-video" position="0 0 0.001" width="1" height="0.753"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('start-btn');
    const arScene = document.getElementById('ar-scene');
    const video = document.getElementById('redwood-video');

    function addLog(msg) {
      log.innerHTML += '<br>' + msg;
      console.log(msg);
    }

    // Catch any uncaught JS errors and show on screen
    window.addEventListener('error', (e) => {
      addLog('❌ JS Error: ' + e.message + ' (' + e.filename?.split('/').pop() + ':' + e.lineno + ')');
    });

    window.addEventListener('unhandledrejection', (e) => {
      addLog('❌ Unhandled promise rejection: ' + e.reason);
    });

    btn.addEventListener('click', () => {
      btn.style.display = 'none';
      addLog('✅ Begin tapped');

      // Show scene
      arScene.style.display = 'block';
      addLog('✅ Scene visible');

      // Listen for A-Frame loaded
      arScene.addEventListener('loaded', () => {
        addLog('✅ A-Frame loaded event fired');
      });

      // Listen for AR events
      arScene.addEventListener('arReady', () => {
        addLog('✅ arReady — camera live!');
      });

      arScene.addEventListener('arError', (e) => {
        addLog('❌ arError: ' + JSON.stringify(e.detail));
      });

      // Try to grab MindAR system immediately and poll until available
      addLog('⏳ Polling for MindAR system...');
      let attempts = 0;
      const poll = setInterval(() => {
        attempts++;
        const sys = arScene.systems['mindar-image-system'];
        if (sys) {
          clearInterval(poll);
          addLog('✅ MindAR system found after ' + attempts + ' attempt(s) — calling start()');
          try {
            sys.start();
            addLog('✅ start() called successfully');
          } catch(e) {
            addLog('❌ start() threw: ' + e.message);
          }
        } else if (attempts >= 50) {
          clearInterval(poll);
          addLog('❌ MindAR system never appeared after ' + attempts + ' attempts');
        } else {
          addLog('⏳ attempt ' + attempts + ' — system not ready yet');
        }
      }, 200);

      // Target events
      const target = arScene.querySelector('[mindar-image-target]');
      target.addEventListener('targetFound', () => {
        addLog('🎯 Target found — playing video');
        video.play().catch(e => addLog('❌ Video play error: ' + e.message));
      });
      target.addEventListener('targetLost', () => {
        addLog('👁 Target lost — pausing video');
        video.pause();
      });
    });
  </script>

</body>
</html>
